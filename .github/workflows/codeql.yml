name: CodeQL

# Static analysis security testing. Analyses the Rust core and the Python /
# JavaScript binding surfaces with GitHub's CodeQL engine. Results appear under
# Security → Code scanning. `build-mode: none` analyses source directly — no
# compilation step — for every language here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 3 * * 0' # Sundays 03:31 UTC

# Least-privilege default for the auto-injected GITHUB_TOKEN. The analyze job
# raises exactly the scopes CodeQL needs (security-events: write to upload
# results) in its own job-level block below; this top-level read-only default
# covers any future job (OpenSSF Scorecard: Token-Permissions).
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a wedged job, not a budget
    permissions:
      security-events: write # upload CodeQL results to code-scanning
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: c-cpp
            build-mode: manual
          - language: csharp
            build-mode: manual
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version: stable
          cache: false
      # `manual` build mode means this workflow owns producing the compiled
      # artefacts CodeQL analyses. Without these, those legs fail rather than
      # analyse nothing, which is the useful behaviour: a language in the matrix
      # with no build is a check that reports success over an empty database.
      - name: Install Rust toolchain
        if: matrix.language == 'go' || matrix.language == 'c-cpp'
        uses: ./.github/actions/setup-rust
      - name: Build the C ABI library
        if: matrix.language == 'go' || matrix.language == 'c-cpp'
        run: cargo build -p wickra-verify-c --release
      - name: Stage the native library for cgo
        if: matrix.language == 'go'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bindings/go/lib/linux_amd64
          cp target/release/libwickra_verify.so bindings/go/lib/linux_amd64/
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          config-file: .github/codeql/codeql-config.yml
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the C and C++ examples
        if: matrix.language == 'c-cpp'
        run: |
          cmake -S examples/c -B examples/c/build
          cmake --build examples/c/build --config Release
      - name: Build the C# binding and tests
        if: matrix.language == 'csharp'
        run: dotnet build bindings/csharp/WickraVerify.Tests/WickraVerify.Tests.csproj -c Release
      # The example is one source file compiled with javac by the Examples
      # job; it has no pom, so a Maven build of examples/java cannot exist.
      - name: Build the Java binding
        if: matrix.language == 'java-kotlin'
        run: mvn -B -f bindings/java package -DskipTests
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"
