# Wickra Verify — workspace.
# "Verify any backtest": given a claimed backtest report plus the strategy and
# candle data it claims to come from, wickra-verify recomputes the report with
# the pinned wickra-backtest engine and confirms or refutes the claim field by
# field, deterministically. The core (`wickra-verify-core`) is exposed as a
# JSON-over-C-ABI data API in ten languages, mirroring the Wickra tiering:
# Rust core -> native Python/Node/WASM + a C ABI hub for C/C++/C#/Go/Java/R.
# It is a free anti-fraud tool: CLI + bindings + an optional static WASM demo,
# never a hosted service.
#
# The `members` list grows as crates are added, phase by phase; the final set is:
#   crates/wickra-verify-core, crates/wickra-verify-cli, crates/verify-bench,
#   bindings/c, bindings/python, bindings/node, bindings/wasm, examples/rust

[workspace]
resolver = "2"
members = [
    "crates/wickra-verify-core",
    "crates/wickra-verify-cli",
    "crates/verify-bench",
    "examples/rust",
    "bindings/c",
    "bindings/python",
    "bindings/node",
    "bindings/wasm",
]
# The fuzz crate is its own (detached) workspace — cargo-fuzz builds it on a
# nightly toolchain with sanitizer flags.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
authors = ["wickra-lib"]
repository = "https://github.com/wickra-lib/wickra-verify"
homepage = "https://wickra.org"
readme = "README.md"
keywords = ["trading", "backtest", "verify", "determinism", "finance"]
categories = ["finance", "command-line-utilities"]

[workspace.dependencies]
# The backtest engine is the runtime dependency: verify recomputes the claimed
# report with it and compares. Its version() is the engine_version the verdict
# is bound to.
#
# Pinned to the published release, exactly. A git rev looked safer while the
# engine was unreleased, but cargo treats "this git URL, default branch" and
# "this git URL at rev X" as two different sources: the fuzz manifest pinned
# the branch while this file pinned the rev, so the fuzz build carried two
# copies of wickra-backtest-core and two `Candle` types that share nothing.
# One registry version cannot split that way, and `cargo publish` needs it
# anyway. Move the version together with fuzz/Cargo.toml, not alone.
#
# wickra-data is deliberately absent. It was declared here and used by nothing:
# the CLI reads its own CSV, and `Candle` comes from the engine, so adding the
# dependency back would mean two crates defining the same row. wickra-proof and
# wickra-strategy-ci reached the same conclusion.
wickra-backtest-core = "=0.1.4"
# Workspace-internal crate, referenced by the CLI, bench and bindings.
wickra-verify-core = { version = "0.1.0", path = "crates/wickra-verify-core" }
# Serialization — the data-driven boundary (claim/verdict/report/command as JSON).
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes serde_json's float parser correctly rounded: a float
# re-parses to the exact same f64 it was written from. Without it the parser can
# land on an adjacent f64 for large magnitudes, which breaks canonicalization
# idempotence (canonicalize -> parse -> canonicalize must be a fixed point) — the
# determinism invariant a verdict shares with wickra-proof, checked by the
# `canonicalize` fuzz target.
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1.1"
# Exact decimal arithmetic where price/qty precision matters.
rust_decimal = { version = "1", features = ["serde"] }
thiserror = "2"
# The canonical verdict/inputs hash (same canonicalization as wickra-proof).
blake3 = "1"
clap = { version = "4", features = ["derive"] }
# C ABI header generation.
cbindgen = "0.27"
# Test/dev.
# codspeed-criterion-compat is a drop-in for criterion: the benches keep
# their criterion API and run as criterion locally, but under
# `cargo codspeed` they report measurements instead of merely executing.
# Without the alias the CodSpeed job runs the benchmarks and uploads
# nothing, which reads as a pass.
criterion = { package = "codspeed-criterion-compat", version = "5.0.1" }
proptest = "1"

[workspace.lints.rust]
# The core and all bindings are safe Rust; the C ABI hub re-allows unsafe
# locally (it must call across the FFI boundary).
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"

[profile.release]
# Panics must never unwind across the C ABI boundary: abort instead.
lto = true
codegen-units = 1
panic = "abort"
strip = true
